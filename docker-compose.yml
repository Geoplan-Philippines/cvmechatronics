# Local headless WordPress backend for development.
# Start:  docker compose up -d
# Admin:  http://localhost:8080/wp-admin
# API:    http://localhost:8080/wp-json/wp/v2
# Stop:   docker compose down        (keeps content)
# Reset:  docker compose down -v     (wipes content)
#
# Production note: this stack is for local development only. For the live
# site, use any managed WordPress host and point WORDPRESS_API_URL at it —
# the frontend code is identical.

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress_dev_password
      MYSQL_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    image: wordpress:6-apache
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress_dev_password
    volumes:
      - wp_data:/var/www/html
      # Auto-loads the `project` custom post type (no plugin clicking needed).
      - ./wordpress/mu-plugins:/var/www/html/wp-content/mu-plugins:ro

volumes:
  db_data:
  wp_data:
